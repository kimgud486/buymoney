name: Scanner Recovery Apply

on:
  push:
    branches:
      - chatgpt/scanner-403-recovery

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/scanner-403-recovery
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply guarded scanner migration
        run: node scripts/apply-real-scanner-server-patch.mjs

      - name: Ensure random scanner generator is gone
        run: |
          if grep -n "Math.random() \* 8000" server.ts; then
            echo "Synthetic scanner candle generator still exists"
            exit 1
          fi
          grep -n "fetchRealScannerCandles(item.symbol, item.market)" server.ts

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        env:
          VITE_FIREBASE_API_KEY: test-only-not-a-secret
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit migrated server
        run: |
          if git diff --quiet -- server.ts; then
            echo "server.ts already migrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "feat(scanner): replace synthetic candles with real OHLCV"
          git push origin HEAD:chatgpt/scanner-403-recovery
