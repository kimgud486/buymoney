name: Fix pattern const assertion once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pattern-const-once.yml'

permissions:
  contents: write

jobs:
  fix-pattern-const:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace invalid computed const assertion only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/scanner/masterPatternDetectionEngine.ts')
          text = p.read_text(encoding='utf-8')
          old = 'export const MASTER_EXECUTABLE_PATTERN_RULES = RULES.map(({ id, direction, minBars }) => ({ id, direction, minBars })) as const;'
          new = 'export const MASTER_EXECUTABLE_PATTERN_RULES = Object.freeze(RULES.map(({ id, direction, minBars }) => ({ id, direction, minBars })));'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target line, found {count}; refusing broad edit')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit exact source fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scanner/masterPatternDetectionEngine.ts
          git commit -m "fix: replace invalid computed const assertion"
          git push origin HEAD:main
