name: One-time finalize AI signals score

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-ai-signals-score.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix callback typo and remove temporary workflow
        shell: bash
        run: |
          sed -i 's/onStateChangeRef\.currrent/onStateChangeRef.current/g' src/components/trading/RealTimeTradingViewChart.tsx
          git rm .github/workflows/one-time-fix-ai-signals-score.yml

      - name: Commit final fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/trading/RealTimeTradingViewChart.tsx
          git commit -m 'fix: finalize AI signals technical score publication'
          git push origin HEAD:main
