name: One-time fix AI signals score

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-ai-signals-score.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AI signals score publication
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/trading/RealTimeTradingViewChart.tsx
          git commit -m 'fix: publish AI signal score without state transition'
          git push origin HEAD:main
