name: Add safe AI E2E once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-safe-ai-e2e-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch package, registry, E2E test and workflow
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['scripts']['test:e2e'] = 'playwright test'
          package['scripts']['test:e2e:safe-ai'] = 'playwright test tests/e2e/safe-ai-scan.spec.ts --project=chromium'
          package.setdefault('devDependencies', {})['@playwright/test'] = '^1.63.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          registry_path = Path('src/ui/ProductionButtonRegistry.ts')
          registry = registry_path.read_text(encoding='utf-8')
          marker = '  // Auto-Trading Switches\n'
          block = '''  // Safe AI Scan-to-Review\n  {\n    id: "safe-ai-autotrade-launcher",\n    category: "TRADING",\n    description: "Runs verified explainable scanner and opens human review candidates without broker auto-order",\n    requiresHandler: true,\n    requiresApi: true,\n    requiresE2E: true\n  },\n\n'''
          if 'id: "safe-ai-autotrade-launcher"' not in registry:
              if registry.count(marker) != 1:
                  raise SystemExit('Registry marker mismatch; refusing broad edit')
              registry = registry.replace(marker, block + marker, 1)
              registry_path.write_text(registry, encoding='utf-8')

          e2e_path = Path('tests/e2e/safe-ai-scan.spec.ts')
          e2e_path.parent.mkdir(parents=True, exist_ok=True)
          e2e_path.write_text(r'''import { test, expect } from "@playwright/test";

const VERIFIED_SCANNER_RESPONSE = {
  success: true,
  scannedAt: "2026-09-10T06:30:00+09:00",
  topIdeas: [
    {
      symbol: "005930",
      name: "E2E 검증종목",
      market: "KOREA",
      score: 92,
      grade: "S",
      decision: "YES",
      price: 75000,
      changePct: 2.4,
      entryLow: 74800,
      entryHigh: 75200,
      stop: 73500,
      target1: 78000,
      target2: 80000,
      rsi: 58,
      rvol: 2.1,
      adx: 28,
      atrPct: 3.2,
      pattern: "BREAKOUT_RETEST",
      bullishReasons: ["VWAP 상단 유지", "RVOL 확장", "돌파 후 재확인"],
      riskReasons: [],
      thesis: "E2E 전용 검증 fixture",
      invalidation: "73500 하향 이탈",
      wouldBuy: true,
    },
  ],
};

test.describe("Safe AI scan-to-review E2E", () => {
  test("launcher calls explainable scanner, ranks verified candidate, and moves it to final chart review", async ({ page }) => {
    let scannerCalls = 0;

    await page.route("**/api/explainable-scanner**", async (route) => {
      scannerCalls += 1;
      const requestUrl = new URL(route.request().url());
      expect(requestUrl.searchParams.get("market")).toBe("ALL");
      expect(requestUrl.searchParams.get("aiExplain")).toBe("true");
      await route.fulfill({
        status: 200,
        contentType: "application/json",
        body: JSON.stringify(VERIFIED_SCANNER_RESPONSE),
      });
    });

    await page.goto("/");

    const launcher = page.getByTestId("safe-ai-autotrade-launcher");
    await expect(launcher).toBeVisible();
    await launcher.click();

    await expect(page.getByText("E2E 검증종목")).toBeVisible();
    await expect(page.getByText(/REVIEW_READY/)).toBeVisible();
    await expect(page.getByText(/R:R 2\.00/)).toBeVisible();
    expect(scannerCalls).toBe(1);

    const finalReview = page.getByRole("button", { name: /이 종목 메인 차트로 이동/ });
    await expect(finalReview).toBeVisible();
    await finalReview.click();

    await expect(page.getByText(/메인 차트 검토 종목으로 선택했습니다/)).toBeVisible();
    await expect(page.getByText(/AI가 브로커 주문을 직접 전송하지 않습니다/)).toBeVisible();
  });

  test("missing verified metrics fail closed instead of fabricating a review-ready candidate", async ({ page }) => {
    await page.route("**/api/explainable-scanner**", async (route) => {
      await route.fulfill({
        status: 200,
        contentType: "application/json",
        body: JSON.stringify({
          success: true,
          scannedAt: "2026-09-10T06:31:00+09:00",
          topIdeas: [
            {
              symbol: "TEST-MISSING",
              name: "불완전 데이터",
              market: "US",
              score: 91,
              price: 100,
              wouldBuy: true,
            },
          ],
        }),
      });
    });

    await page.goto("/");
    await page.getByTestId("safe-ai-autotrade-launcher").click();

    await expect(page.getByText("불완전 데이터")).toBeVisible();
    await expect(page.getByText(/NO ·/)).toBeVisible();
    await expect(page.getByText(/RSI 실측값이 확인되지 않았습니다/)).toBeVisible();
    await expect(page.getByText(/RVOL 실측값이 확인되지 않았습니다/)).toBeVisible();
    await expect(page.getByText(/REVIEW_READY/)).toHaveCount(0);
  });
});
''', encoding='utf-8')

          workflow_path = Path('.github/workflows/safe-ai-e2e.yml')
          workflow_path.write_text(r'''name: Safe AI Scan E2E

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-ai-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safe-ai-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_FIREBASE_API_KEY: test-only-not-a-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Safe AI scan-to-review E2E
        run: npm run test:e2e:safe-ai
''', encoding='utf-8')
          PY

      - name: Synchronize npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/ui/ProductionButtonRegistry.ts tests/e2e/safe-ai-scan.spec.ts .github/workflows/safe-ai-e2e.yml
          git commit -m "test: wire safe AI scan-to-review Playwright E2E"
          git push origin HEAD:main
