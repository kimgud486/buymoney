name: Safe AI Balance Cache One Shot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-safe-ai-balance-cache:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply guarded Safe AI balance cache patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/trading/SafeAiAutotradeLauncher.tsx')
          text = path.read_text()

          old_const = 'const CASH_SAFETY_BUFFER_RATIO = 0.995;\n'
          new_const = old_const + 'const BALANCE_SYNC_CACHE_MS = 30_000;\n'
          if old_const not in text:
              raise SystemExit('CASH_SAFETY_BUFFER_RATIO anchor missing')
          if 'BALANCE_SYNC_CACHE_MS' not in text:
              text = text.replace(old_const, new_const, 1)

          old_ref = '  const lastOrderAttemptRef = useRef<Map<string, number>>(new Map());\n'
          new_ref = old_ref + '  const freshCashCacheRef = useRef<Map<TradeMarket, { cash: number; syncedAt: number }>>(new Map());\n'
          if old_ref not in text:
              raise SystemExit('lastOrderAttemptRef anchor missing')
          if 'freshCashCacheRef' not in text:
              text = text.replace(old_ref, new_ref, 1)

          old_block = '''      let availableCash = freshCashByMarket.get(candidateMarket);\n      if (availableCash === undefined && !balanceFailureByMarket.has(candidateMarket)) {\n        try {\n          const syncResult = await syncRealAccountBalance(mapBalanceBroker(candidateMarket), true);\n          if (!syncResult?.success) {\n            balanceFailureByMarket.set(candidateMarket, syncResult?.message || "브로커 가용잔고 조회에 실패했습니다.");\n          } else {\n            const syncedBreakdown = syncResult?.cashBreakdown ?? syncResult?.rawResponse?.cashBreakdown;\n            const syncedMarketCash = readMarketCash(candidateMarket, syncedBreakdown);\n            if (syncedMarketCash === null) {\n              balanceFailureByMarket.set(candidateMarket, "브로커 응답에서 시장별 가용잔고를 확인할 수 없습니다.");\n            } else {\n              availableCash = syncedMarketCash;\n              freshCashByMarket.set(candidateMarket, syncedMarketCash);\n            }\n          }\n        } catch (error: any) {\n          balanceFailureByMarket.set(candidateMarket, error?.message || "브로커 가용잔고 조회 중 오류가 발생했습니다.");\n        }\n      }\n'''
          new_block = '''      let availableCash = freshCashByMarket.get(candidateMarket);\n      if (availableCash === undefined) {\n        const cachedCash = freshCashCacheRef.current.get(candidateMarket);\n        if (cachedCash && now - cachedCash.syncedAt < BALANCE_SYNC_CACHE_MS) {\n          availableCash = cachedCash.cash;\n          freshCashByMarket.set(candidateMarket, cachedCash.cash);\n        }\n      }\n\n      if (availableCash === undefined && !balanceFailureByMarket.has(candidateMarket)) {\n        try {\n          const syncResult = await syncRealAccountBalance(mapBalanceBroker(candidateMarket), true);\n          if (!syncResult?.success) {\n            balanceFailureByMarket.set(candidateMarket, syncResult?.message || "브로커 가용잔고 조회에 실패했습니다.");\n          } else {\n            const syncedBreakdown = syncResult?.cashBreakdown ?? syncResult?.rawResponse?.cashBreakdown;\n            const syncedMarketCash = readMarketCash(candidateMarket, syncedBreakdown);\n            if (syncedMarketCash === null) {\n              balanceFailureByMarket.set(candidateMarket, "브로커 응답에서 시장별 가용잔고를 확인할 수 없습니다.");\n            } else {\n              availableCash = syncedMarketCash;\n              freshCashByMarket.set(candidateMarket, syncedMarketCash);\n              freshCashCacheRef.current.set(candidateMarket, { cash: syncedMarketCash, syncedAt: now });\n            }\n          }\n        } catch (error: any) {\n          balanceFailureByMarket.set(candidateMarket, error?.message || "브로커 가용잔고 조회 중 오류가 발생했습니다.");\n        }\n      }\n'''
          if old_block not in text:
              raise SystemExit('balance sync block anchor missing')
          text = text.replace(old_block, new_block, 1)

          path.write_text(text)
          PY
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Run risk authority regression tests
        run: node --import tsx --test tests/v20_final_authority_wiring.test.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/trading/SafeAiAutotradeLauncher.tsx
          git commit -m "fix: cache Safe AI broker balance sync for 30s"
          git push
