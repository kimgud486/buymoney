name: Safe AI Status One Shot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-safe-ai-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Add operator-friendly Safe AI statuses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/trading/SafeAiAutotradeLauncher.tsx')
          s = p.read_text()

          anchor = '''interface CandidateExecutionUi {
  state: ExecutionState;
  message: string;
}
'''
          insert = '''interface CandidateExecutionUi {
  state: ExecutionState;
  message: string;
}

type OperatorStatus =
  | "SCANNING"
  | "WAITING_SIGNAL"
  | "MARKET_CLOSED"
  | "NO_QUOTE"
  | "STALE_QUOTE"
  | "RISK_BLOCKED"
  | "ORDER_SUBMITTED"
  | "ORDER_REJECTED"
  | "AUTH_ERROR"
  | "API_ERROR";

const OPERATOR_STATUS_LABEL: Record<OperatorStatus, string> = {
  SCANNING: "스캔 중",
  WAITING_SIGNAL: "신호 대기",
  MARKET_CLOSED: "장 마감",
  NO_QUOTE: "시세 없음",
  STALE_QUOTE: "시세 지연",
  RISK_BLOCKED: "위험 차단",
  ORDER_SUBMITTED: "주문 전송",
  ORDER_REJECTED: "주문 거절",
  AUTH_ERROR: "인증 오류",
  API_ERROR: "API 오류",
};

const classifyExecutionStatus = (item?: CandidateExecutionUi): OperatorStatus => {
  if (!item) return "WAITING_SIGNAL";
  const message = String(item.message || "").toLowerCase();
  if (item.state === "EXECUTED") return "ORDER_SUBMITTED";
  if (item.state === "SUBMITTING") return "SCANNING";
  if (/장.?마감|market.?closed|off.?market|거래.?시간/.test(message)) return "MARKET_CLOSED";
  if (/시세.*없|quote.*(missing|unavailable)|가격.*없/.test(message)) return "NO_QUOTE";
  if (/지연|stale|실시간성/.test(message)) return "STALE_QUOTE";
  if (/인증|credential|api.?key|app.?key|secret|토큰|token/.test(message)) return "AUTH_ERROR";
  if (item.state === "FAILED") return "API_ERROR";
  if (/거절|reject/.test(message)) return "ORDER_REJECTED";
  if (item.state === "SKIPPED") return "RISK_BLOCKED";
  return "WAITING_SIGNAL";
};
'''
          if anchor not in s:
              raise SystemExit('CandidateExecutionUi anchor missing')
          s = s.replace(anchor, insert, 1)

          old = '''  const executionBadge = (symbol: string) => {
    const item = executionUi[symbol];
    if (!item) return null;
    const cls = item.state === "EXECUTED"
      ? "border-emerald-500/30 bg-emerald-500/10 text-emerald-300"
      : item.state === "FAILED"
        ? "border-rose-500/30 bg-rose-500/10 text-rose-300"
        : item.state === "SUBMITTING"
          ? "border-cyan-500/30 bg-cyan-500/10 text-cyan-300"
          : "border-amber-500/30 bg-amber-500/10 text-amber-300";
    return <span className={`rounded-md border px-1.5 py-0.5 text-[9px] font-black ${cls}`}>{item.state}</span>;
  };
'''
          new = '''  const executionBadge = (symbol: string) => {
    const item = executionUi[symbol];
    if (!item) return null;
    const status = classifyExecutionStatus(item);
    const cls = status === "ORDER_SUBMITTED"
      ? "border-emerald-500/30 bg-emerald-500/10 text-emerald-300"
      : status === "API_ERROR" || status === "AUTH_ERROR" || status === "ORDER_REJECTED"
        ? "border-rose-500/30 bg-rose-500/10 text-rose-300"
        : status === "SCANNING"
          ? "border-cyan-500/30 bg-cyan-500/10 text-cyan-300"
          : "border-amber-500/30 bg-amber-500/10 text-amber-300";
    return <span className={`rounded-md border px-1.5 py-0.5 text-[9px] font-black ${cls}`}>{OPERATOR_STATUS_LABEL[status]}</span>;
  };
'''
          if old not in s:
              raise SystemExit('executionBadge anchor missing')
          s = s.replace(old, new, 1)

          old_detail = '''{executionUi[selectedCandidate.symbol] && <div className="mt-3 rounded-lg border border-slate-800 bg-slate-900 p-3 text-xs"><strong className="text-white">자동매매 상태: {executionUi[selectedCandidate.symbol].state}</strong><p className="mt-1 text-slate-400">{executionUi[selectedCandidate.symbol].message}</p></div>}'''
          new_detail = '''{executionUi[selectedCandidate.symbol] && <div className="mt-3 rounded-lg border border-slate-800 bg-slate-900 p-3 text-xs"><strong className="text-white">자동매매 상태: {OPERATOR_STATUS_LABEL[classifyExecutionStatus(executionUi[selectedCandidate.symbol])]}</strong><p className="mt-1 text-slate-400">{executionUi[selectedCandidate.symbol].message}</p></div>}'''
          if old_detail not in s:
              raise SystemExit('detail status anchor missing')
          s = s.replace(old_detail, new_detail, 1)

          p.write_text(s)
          PY
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Safe AI E2E
        run: npx playwright test tests/e2e/safe-ai-scan.spec.ts
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/trading/SafeAiAutotradeLauncher.tsx
          git commit -m "feat: show operator-friendly Safe AI execution statuses"
          git push
