name: Apply KIS Holdings and Dashboard Truth Fix

on:
  push:
    branches:
      - main
    paths:
      - scripts/fix-kis-holdings-and-dashboard-truth.mjs
      - .github/workflows/apply-kis-holdings-dashboard-truth.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Normalize temporary patcher quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/fix-kis-holdings-and-dashboard-truth.mjs')
          text = path.read_text()

          start_marker = 'const overseasBalanceFunction = `'
          end_marker = '\n`;\n\nserver = replaceBetween('
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          body = text[start:end]
          body = body.replace('`', '\\`')
          body = re.sub(r'(?<!\\)\$\{', r'\\${', body)
          text = text[:start] + body + text[end:]

          dashboard_marker = '// 3) Dashboard: direct React chart expansion + truth-only display values'
          dashboard_start = text.index(dashboard_marker)
          head = text[:dashboard_start]
          tail = text[dashboard_start:]
          tail = re.sub(r'(?<!\\)\$\{', r'\\${', tail)
          text = head + tail

          path.write_text(text)
          PY

      - name: Apply targeted fixes
        run: node scripts/fix-kis-holdings-and-dashboard-truth.mjs

      - name: Verify patch and compile
        run: |
          git diff --check
          npm ci
          npm run lint
          npm run build

      - name: Commit and rebase verified production paths
        run: |
          if git diff --quiet -- server.ts src/context/AppContext.tsx src/components/trading/MasterAiAutoTradingDashboard.tsx src/App.tsx; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts src/context/AppContext.tsx src/components/trading/MasterAiAutoTradingDashboard.tsx src/App.tsx
          git commit -m "fix: restore KIS overseas holdings and truthful live dashboard"

          # The quote-normalization step intentionally edits only the temporary
          # applicator in the runner workspace. Do not carry that helper mutation
          # into the product commit or let it block the rebase.
          git restore -- scripts/fix-kis-holdings-and-dashboard-truth.mjs

          # main can advance while lint/build run. Rebase the already-verified patch
          # on top of the latest main; fail safely on any real product conflict.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
