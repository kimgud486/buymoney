name: V23 Test Policy Repair Once

on:
  push:
    branches:
      - chatgpt/scanner-403-recovery

permissions:
  contents: write

concurrency:
  group: v23-test-policy-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      VITE_FIREBASE_API_KEY: test-only-not-a-secret
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/scanner-403-recovery
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Patch V23 execution lifecycle tests only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/v23_autonomous_trading_architecture.test.ts')
          s = p.read_text()
          old = '    const orchestrator = new AutonomousTradingOrchestrator(router, orderManager, killSwitch, reconciler);'
          new = '''    const orchestrator = new AutonomousTradingOrchestrator(
                router,
                orderManager,
                killSwitch,
                reconciler,
                { ...DEFAULT_AUTONOMOUS_RISK_POLICY, mode: "LIVE_RESTRICTED" }
              );'''
          count = s.count(old)
          if count != 3:
              raise SystemExit(f'Expected exactly 3 V23 orchestrator execution-test anchors, found {count}. Refusing patch.')
          p.write_text(s.replace(old, new))
          PY

      - name: Confirm production default remains SIGNAL_ONLY
        run: grep -n 'mode: "SIGNAL_ONLY"' src/risk/AutonomousRiskPolicy.ts

      - name: Typecheck
        run: npm run lint

      - name: Full test suite
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit V23 test-only policy fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v23_autonomous_trading_architecture.test.ts
          if git diff --cached --quiet; then
            echo "No V23 test changes to commit"
            exit 0
          fi
          git commit -m "test: exercise V23 execution lifecycle with explicit restricted policy"
          git push origin HEAD:chatgpt/scanner-403-recovery
