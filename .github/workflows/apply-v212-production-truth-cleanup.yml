name: Apply V21.2 Production Truth Cleanup

on:
  push:
    branches:
      - fix/v21-2-live-broker-truth-20260910
    paths:
      - scripts/apply-v212-production-truth-cleanup.mjs
      - .github/workflows/apply-v212-production-truth-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v21-2-live-broker-truth-20260910
          fetch-depth: 0

      - name: Apply production truth cleanup
        run: node scripts/apply-v212-production-truth-cleanup.mjs

      - name: Verify patch shape
        run: |
          git diff --check
          grep -Fq 'SYNTHETIC_BACKTEST_REMOVED' server.ts
          grep -Fq 'SIMULATED_AUTOTRADE_REMOVED' server.ts
          grep -Fq 'VERIFIED_THEME_DATA_REQUIRED' server.ts
          grep -Fq 'VERIFIED_ARBITRAGE_DATA_REQUIRED' server.ts
          if grep -Fq 'price: 78500' server.ts; then
            echo 'hardcoded theme stock payload survived cleanup' >&2
            exit 1
          fi

      - name: Commit cleaned production routes
        run: |
          if git diff --quiet -- server.ts; then
            echo 'No server.ts changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(truth): disable synthetic production market routes"
          git push origin HEAD:fix/v21-2-live-broker-truth-20260910
