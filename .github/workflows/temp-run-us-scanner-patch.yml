name: Temp Run US Scanner Patch

on:
  push:
    paths:
      - .github/workflows/temp-run-us-scanner-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch scanner
        run: python .github/scripts/patch_us_scanner.py
      - name: Verify patch
        run: |
          grep -q 'const getUsScannerUniverse' src/components/RealtimeStockMarketScanner.tsx
          grep -q 'const usScannerUniverse = getUsScannerUniverse' src/components/RealtimeStockMarketScanner.tsx
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Fake-data audit
        run: npm run audit:fake-data
      - name: Build
        run: npm run build
      - name: Commit scanner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RealtimeStockMarketScanner.tsx
          git commit -m "fix: enable US market scanner"
          git push origin HEAD:main
