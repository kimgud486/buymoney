name: Apply V21.7 Truth Hardening

on:
  push:
    branches:
      - fix/v21-7-truth-hardening-20260910
    paths:
      - scripts/apply-v217-truth-hardening.mjs
      - .github/workflows/apply-v217-truth-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v21-7-truth-hardening-20260910
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V21.7 truth hardening
        run: node scripts/apply-v217-truth-hardening.mjs
      - name: Commit migrated server
        run: |
          if git diff --quiet -- server.ts; then
            echo "No server.ts changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(truth): harden production execution and broker probes"
          git push origin HEAD:fix/v21-7-truth-hardening-20260910
