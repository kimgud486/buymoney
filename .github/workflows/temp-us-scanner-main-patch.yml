name: Temp US Scanner Main Patch

on:
  push:
    paths:
      - '.github/workflows/temp-us-scanner-main-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch US scanner wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/RealtimeStockMarketScanner.tsx')
          s = p.read_text(encoding='utf-8')

          marker = '  const [stocks, setStocks] = useState<ScannerStock[]>(INITIAL_UNIVERSE);\n'
          if marker not in s:
              raise SystemExit('stocks init marker not found')

          replacement = '''  const mapGlobalScannedStock = (item: GlobalScannedStock, index: number): ScannerStock => ({
    id: `global-${item.market}-${item.symbol}`,
    rank: index + 1,
    symbol: item.symbol,
    name: item.name,
    market: item.market,
    capType: getCapType({ symbol: item.symbol, tradingValue: item.tradingValue }),
    price: Number(item.price) || 0,
    changePct: Number(item.changePct) || 0,
    tradingValue: Number(item.tradingValue) || 0,
    volumeStatus: item.rvol >= 3 ? "급증" : item.rvol >= 1.5 ? "증가" : "보통",
    rvol: Number(item.rvol) || 0,
    executionPower: Math.max(0, Math.round(100 + (Number(item.changePct) || 0) * 2 + (Number(item.rvol) || 0) * 5)),
    aiScore: Number(item.scores?.totalScore) || 0,
    aiScoreChange: Math.max(0, Math.round((Number(item.changePct) || 0) + (Number(item.rvol) || 0))),
    hasBos: ["Breakout", "Breakout+Retest", "52W High", "Volume Breakout", "Gap & Go", "ORB", "Base Breakout", "Momentum Continuation", "Relative Strength Leader"].includes(item.setup),
    hasChoch: item.setup === "VCP",
    hasVwapBreak: item.setup === "EMA Pullback" || Number(item.scores?.emaAlignment || 0) >= 8,
    hasNews: Array.isArray(item.catalysts) && item.catalysts.length > 0
  });

  const getUsScannerUniverse = (): ScannerStock[] =>
    GlobalStockDiscoveryScannerService.runPipeline({
      market: "US",
      minScore: 0,
      gradeFilter: "ALL",
      setupFilter: "ALL",
      searchQuery: ""
    }).map(mapGlobalScannedStock);

  const INITIAL_US_UNIVERSE = getUsScannerUniverse();
  const ALL_INITIAL_UNIVERSE = [
    ...INITIAL_UNIVERSE,
    ...INITIAL_US_UNIVERSE.filter(
      (us) => !INITIAL_UNIVERSE.some((base) => base.symbol.toUpperCase() === us.symbol.toUpperCase())
    )
  ];

  const [stocks, setStocks] = useState<ScannerStock[]>(ALL_INITIAL_UNIVERSE);
'''
          s = s.replace(marker, replacement, 1)

          old = '      const symbolList = INITIAL_UNIVERSE.map(s => s.symbol).join(",");\n'
          new = '''      const usScannerUniverse = getUsScannerUniverse();
      setStocks((prev) => {
        const merged = [...prev];
        usScannerUniverse.forEach((candidate) => {
          const idx = merged.findIndex((item) => item.symbol.toUpperCase() === candidate.symbol.toUpperCase());
          if (idx >= 0) merged[idx] = { ...merged[idx], ...candidate, flash: merged[idx].flash };
          else merged.push(candidate);
        });
        return merged;
      });
      const symbolList = [...INITIAL_UNIVERSE, ...usScannerUniverse]
        .map((s) => s.symbol)
        .filter((symbol, index, all) => all.indexOf(symbol) === index)
        .join(",");
'''
          if old not in s:
              raise SystemExit('symbolList marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify patch markers
        run: |
          grep -q 'const getUsScannerUniverse' src/components/RealtimeStockMarketScanner.tsx
          grep -q 'const INITIAL_US_UNIVERSE' src/components/RealtimeStockMarketScanner.tsx
          grep -q 'const usScannerUniverse = getUsScannerUniverse' src/components/RealtimeStockMarketScanner.tsx

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RealtimeStockMarketScanner.tsx
          git commit -m "fix: enable US market scanner universe"
          git push origin HEAD:main
