name: Apply Real Precheck Cleanup

on:
  push:
    branches:
      - integration/buymoney-final-buy-hold
    paths:
      - scripts/replace-legacy-explainable-with-real-precheck.mjs
      - .github/workflows/apply-real-precheck-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/buymoney-final-buy-hold
          fetch-depth: 0

      - name: Replace synthetic public precheck
        run: node scripts/replace-legacy-explainable-with-real-precheck.mjs

      - name: Verify patch
        run: |
          git diff --check
          if git diff --quiet -- server.ts; then
            echo "Cleanup already applied."
            exit 0
          fi
          git diff -- server.ts

      - name: Commit production truth cleanup
        run: |
          if git diff --quiet -- server.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.ts
          git commit -m "fix(truth): remove public synthetic scanner and index fallback"
          git push origin HEAD:integration/buymoney-final-buy-hold
