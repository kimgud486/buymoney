name: Temp Domestic Scanner Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_domestic_scanner.py'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Patch domestic scanner
        run: python .github/scripts/patch_domestic_scanner.py

      - name: Verify patch markers
        run: |
          grep -n "VERIFIED_KOREA_SCANNER_V192" src/components/RealtimeStockMarketScanner.tsx
          grep -n "tradingValue: item.tradeValue" server.ts
          grep -n "market=KOREA" src/components/RealtimeStockMarketScanner.tsx

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Fake-data audit
        run: npm run audit:fake-data

      - name: Build
        run: npm run build

      - name: Commit domestic scanner fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/RealtimeStockMarketScanner.tsx server.ts
          if git diff --cached --quiet; then
            echo "No scanner changes to commit"
            exit 0
          fi
          git commit -m "fix: wire domestic scanner to verified KRX V19.2"
          git push origin HEAD:main
